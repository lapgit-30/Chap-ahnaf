ng",desc:"چاپ لیزری تک‌رنگ با وضوح بالا برای اسناد متنی، مقالات، جزوات و پروژه‌های اداری. سرعت چاپ در این روش نسبت به چاپ رنگی به مراتب بیشتر است و هزینه هر برگه به‌طور قابل توجهی پایین‌تر می‌آید (حدود یک‌سوم قیمت چاپ رنگی)؛ به همین دلیل برای تیراژ بالا و حجم زیاد صفحات (مانند جزوات صد صفحه‌ای) گزینه‌ای کاملاً اقتصادی محسوب می‌شود. کاغذ استاندارد مورد استفاده ۷۰ تا ۸۰ گرمی است و امکان چاپ دورو (پشت و رو) نیز بدون افت کیفیت وجود دارد. زمان آماده‌سازی برای حجم‌های معمولی (تا ۵۰ برگه) کمتر از ۱۰ دقیقه است.",badge:"پرکاربرد",icon:"Printer"},{id:"color-print",title:"چاپ رنگی",enTitle:"Color Printing",category:"printing",desc:"چاپ تمام‌رنگی با تطابق ۹۹ درصدی رنگ خروجی نسبت به فایل اصلی، مناسب برای گزارش‌های تصویری، پروژه‌های دانشگاهی مصور، کاتالوگ و رزومه‌های خلاقانه. برخلاف چاپ سیاه‌وسفید که فقط برای متن مناسب است، این روش امکان چاپ نمودار، عکس و طرح‌های گرافیکی رنگی را با کیفیت بالا فراهم می‌کند. کاغذ قابل انتخاب شامل تحریر ۸۰ گرمی، گلاسه ۱۳۵ گرمی و مقواهای ضخیم است. به دلیل مصرف بیشتر جوهر و کندتر بودن پردازش رنگ، هزینه هر برگه بالاتر از چاپ سیاه‌وسفید بوده و زمان تحویل برای حجم بالا (بیش از ۱۰۰ برگه) معمولاً بین ۳۰ دقیقه تا ۱ ساعت است.",badge:"کیفیت عالی",icon:"Printer"},{id:"photocopy",title:"فتوکپی",enTitle:"Photocopy",category:"printing",desc:"تکثیر سریع اسناد، کتاب‌ها، مدارک شناسایی و جزوات کلاسی با دستگاه‌های کپی صنعتی پرسرعت (تا ۶۰ برگه در دقیقه). امکان کپی دورو و تک‌رو، بزرگ‌نمایی و کوچک‌نمایی (زوم از ۲۵٪ تا ۴۰۰٪) و کپی چند برگه در یک صفحه (مانند ۲ در ۱ یا ۴ در ۱) برای صرفه‌جویی در کاغذ فراهم است. برای مدارک هویتی مانند کارت ملی و شناسنامه، کپی با کیفیت واضح و بدون سایه ارائه می‌شود. برای جزوات کلاسی حجیم، امکان مرتب‌سازی خودکار برگه‌ها (Collate) و منگنه رایگان نیز موجود است. تحویل فوری در همان لحظه انجام می‌گیرد.",badge:"تحویل فوری",icon:"Copy"},{id:"photo-print",title:"چاپ عکس",enTitle:"Photo Printing",category:"printing",desc:"چاپ عکس دیجیتال با تکنولوژی چاپ عکاسی حرفه‌ای (نه چاپ معمولی جوهرافشان) در سایزهای ۳×۴، ۱۰×۱۵، ۱۳×۱۸، ۲۰×۳۰ و تا ابعاد بزرگ آلبومی و دیواری (A3 و بزرگ‌تر). سه نوع کاغذ قابل انتخاب است: گلاسه (براق)، سیلک (نیمه‌مات با بافت ابریشمی) و متالیک (درخشان با جلوه فلزی). ماندگاری رنگ در برابر نور و رطوبت تا بیش از ۲۰ سال تضمین می‌شود. زمان آماده‌سازی برای تعداد کم (زیر ۲۰ قطعه) حدود ۱۵ دقیقه و برای آلبوم‌های کامل حدود ۱ روز کاری است.",badge:"ماندگاری بالا",icon:"Image"},{id:"business-card",title:"کارت ویزیت",enTitle:"Business Card",category:"printing",desc:"طراحی و چاپ کارت ویزیت در جنس‌های متنوع: سلفون مات یا براق (اقتصادی)، لمینت برجسته (شکیل و ضدآب)، لمینت طلاکوب و نقره‌کوب (لوکس و رسمی)، کتان آلمان (بافت‌دار و مقاوم) و پی‌وی‌سی (مانند کارت بانکی، انعطاف‌ناپذیر و بادوام). هر بسته استاندارد شامل ۱۰۰۰ عدد کارت است، اما سفارش تیراژ کمتر (حتی از ۲۰۰ عدد) نیز با هزینه متناسب پذیرفته می‌شود. در صورت نداشتن فایل آماده، طراحان ما یک طرح اختصاصی متناسب با نوع کسب‌وکار شما آماده می‌کنند؛ در غیر این صورت فایل باید با رزولوشن حداقل ۳۰۰ dpi و فرمت PDF یا AI ارسال شود. زمان تحویل استاندارد ۱ تا ۲ روز کاری است.",badge:"طراحی ویژه",icon:"CreditCard"},{id:"flyer",title:"تراکت",enTitle:"Flyer",category:"printing",desc:"چاپ تراکت تبلیغاتی در ابعاد استاندارد A4 (تمام صفحه)، A5 (نصف صفحه) و A6 (ربع صفحه)، مناسب برای پخش دستی، درج در صندوق پستی یا نصب بر شیشه مغازه‌ها. جنس کاغذ معمولاً تحریر ۸۰ گرمی برای تراکت‌های اقتصادی و گلاسه ۱۳۵ گرمی برای نمای براق‌تر است. این خدمت برای تیراژ بالا (از ۱۰۰۰ عدد به بالا) بسیار مقرون‌به‌صرفه بوده و هرچه تعداد بیشتر باشد، قیمت هر برگه کاهش می‌یابد. زمان چاپ برای تیراژ ۱۰۰۰ عددی حدود ۲۴ ساعت است.",badge:"اقتصادی",icon:"Files"},{id:"brochure",title:"بروشور",enTitle:"Brochure",category:"printing",desc:"چاپ بروشورهای تاشو در حالت‌های ۲ لتی (یک تای وسط)، ۳ لتی (تای سه‌قسمتی مانند دروازه‌ای یا حلزونی) و چندلتی برای معرفی جامع محصولات و خدمات. خط تای (Crease) دقیق و ماشینی باعث می‌شود کاغذ گلاسه ۱۳۵ تا ۱۷۰ گرمی بدون ترک خوردن و به‌طور تمیز تا بخورد. پوشش سلفون مات یا براق روی سطح باعث افزایش دوام و شکیل‌تر شدن ظاهر بروشور در دست مشتری می‌شود. مناسب برای نمایشگاه‌ها، معرفی شرکت و راهنمای محصول. زمان تحویل معمولی ۲ تا ۳ روز کاری است.",badge:"حرفه‌ای",icon:"BookOpen"},{id:"poster",title:"پوستر",enTitle:"Poster",category:"printing",desc:"چاپ پوستر در ابعاد بزرگ استاندارد A3، A2، A1 و حتی سایزهای سفارشی بزرگ‌تر برای اطلاع‌رسانی همایش‌ها، رویدادهای فرهنگی و هنری و تبلیغات داخل فروشگاه. برخلاف تراکت که برای پخش دستی طراحی می‌شود، پوستر برای نصب ثابت روی دیوار یا تابلو اعلانات در نظر گرفته شده و از کاغذ گلاسه ضخیم‌تر (۱۵۰ تا ۲۰۰ گرمی) استفاده می‌شود. در صورت نیاز، پوشش لمینت مات برای محافظت در برابر نور خورشید و رطوبت اضافه می‌گردد. زمان تحویل برای تک نسخه حدود ۲۰ دقیقه است.",icon:"Layout"},{id:"banner",title:"بنر",enTitle:"Banner",category:"printing",desc:"چاپ بنر در سایزهای استاندارد رایج مانند ۷۰×۱۰۰، ۱۰۰×۱۵۰ سانتی‌متر و ابعاد بزرگ‌تر تا عرض ۳ متر برای بنرهای سردرب مغازه. دو جنس اصلی موجود است: بنر پی‌وی‌سی (فلکسی) که مقاوم در برابر آب و آفتاب بوده و برای نصب بیرون از ساختمان مناسب است، و بنر پارچه‌ای (استرچ) که ظاهری شیک‌تر داشته و بیشتر برای غرفه‌های نمایشگاهی و داخل سالن استفاده می‌شود. تمامی بنرها با پانچ فلزی دور تا دور (برای آویزان کردن با طناب) و دوردوزی مقاوم تحویل داده می‌شوند تا در برابر باد پاره نشوند. زمان چاپ بنرهای معمولی حدود ۱ تا ۲ ساعت است.",badge:"مقاوم در برابر آفتاب",icon:"Maximize"},{id:"label",title:"لیبل",enTitle:"Label",category:"printing",desc:"طراحی و چاپ برچسب در جنس‌های کاغذی (اقتصادی)، شیشه‌ای (شفاف برای ظروف)، سلفونی (ضدآب) و یووی (مقاوم در برابر سایش) به‌صورت شیت یا رول. برش لیبل به دو روش انجام می‌شود: برش کامل (هر لیبل کاملاً جدا) یا نیم‌برش/دای‌کات (لیبل روی پشت‌کاغذ باقی می‌ماند و به‌راحتی جدا می‌شود) که امکان برش در هر شکل هندسی دلخواه (دایره، بیضی، ستاره و...) وجود دارد. کاربرد اصلی این خدمت برای برچسب ظروف بسته‌بندی، شیشه عسل و ترشیجات، جعبه‌های محصولات تولیدی و لیبل قیمت است.",badge:"برش دلخواه",icon:"Tag"},{id:"letterhead",title:"سربرگ",enTitle:"Letterhead",category:"printing",desc:"چاپ سربرگ اداری و شرکتی در ابعاد A4 و A5، شامل لوگو، نام شرکت، آدرس و اطلاعات تماس در بالای صفحه. کاغذ استاندارد ۸۰ گرمی برای مکاتبات روزمره و کاغذ کتان (بافت‌دار) ۱۰۰ گرمی برای اسناد رسمی و قراردادهای مهم پیشنهاد می‌شود. رنگ‌آمیزی لوگو می‌تواند تک‌رنگ (اقتصادی) یا تمام‌رنگی (برای هماهنگی کامل با برند شما) باشد. این سربرگ‌ها معمولاً برای نامه‌نگاری اداری، نسخه‌های پزشکی و فاکتورهای رسمی استفاده می‌شوند. حداقل تیراژ اقتصادی ۱۰۰ برگه است.",icon:"FileText"},{id:"envelope",title:"پاکت",enTitle:"Envelope",category:"printing",desc:"چاپ و ساخت پاکت ملخی (اداری، برای نامه‌های تاشده)، پاکت A4 (برای اسناد بدون تا) و پاکت A5 در جنس‌های تحریر معمولی، گلاسه (شکیل‌تر) و کتان (بافت‌دار و مقاوم). چسب لبه از نوع خشک (مرطوب‌شونده با آب) یا خودچسب (بدون نیاز به مرطوب کردن) قابل انتخاب است. خط تای دقیق ماشینی باعث می‌شود پاکت به‌طور یکنواخت بسته شود. کاربرد اصلی برای بسته‌بندی اسناد رسمی، قراردادها و مدارک اداری است. حداقل سفارش اقتصادی ۲۰۰ عدد است.",icon:"Mail"},{id:"thesis-binding",title:"پایان‌نامه",enTitle:"Thesis Binding",category:"printing",desc:"پرینت لیزری با کیفیت بالا (سیاه‌وسفید برای متن و رنگی برای نمودارها) به همراه صحافی گالینگور (جلد سخت مقوایی با روکش چرم‌نما) که استاندارد رسمی اکثر دانشگاه‌های کشور برای پایان‌نامه کارشناسی، کارشناسی ارشد و دکتری است. روی جلد و عطف کتاب، عنوان پایان‌نامه، نام دانشجو و استاد راهنما با تکنیک طلاکوب یا نقره‌کوب حک می‌شود. رعایت دقیق فرمت صفحه‌بندی مصوب دانشگاه (حاشیه‌ها، فونت B Nazanin یا Times New Roman) توسط تیم ما بررسی می‌گردد. زمان تحویل معمولی ۱ تا ۲ روز کاری است.",badge:"مخصوص دانشجویان",icon:"Book"},{id:"booklet",title:"جزوه",enTitle:"Booklet",category:"printing",desc:"پرینت و تکثیر سریع جزوات کلاسی و دوره‌های آموزشی با جلد طلق رنگی ضخیم (شفاف یا رنگی) که از پارگی و کثیف شدن صفحات جلوگیری می‌کند. دو نوع صحافی رایج برای جزوات ارائه می‌شود: شیرازه (چسب گرم از یک طرف، مناسب جزوات نازک) و فنر مارپیچ فلزی (باز و بسته شدن راحت صفحات، مناسب جزوات ضخیم که باید صاف روی میز باز بمانند). امکان جداسازی فصول با کاغذهای رنگی راهنما نیز وجود دارد. زمان آماده‌سازی برای هر جزوه حدود ۱۵ تا ۳۰ دقیقه است.",badge:"سفارش پرحجم",icon:"FileCode"},{id:"book-printing",title:"کتاب",enTitle:"Book Printing",category:"printing",desc:"چاپ و صحافی کتاب در تیراژهای محدود (چاپ دیجیتال از ۱ نسخه برای آرشیو شخصی) تا تیراژهای بالا، با دو گزینه جلد: شومیز (جلد نرم با چسب گرم، اقتصادی و سبک، مناسب رمان و جزوه) یا گالینگور (جلد سخت، شکیل و بادوام، مناسب کتاب مرجع و آرشیوی). پیش از چاپ نهایی، مشاوره رایگان صفحه‌آرایی (فونت، حاشیه، شماره صفحه) ارائه می‌شود تا کتاب استاندارد نشر داشته باشد. زمان تحویل بسته به تیراژ از ۱ روز (تک نسخه) تا چند روز کاری متغیر است.",icon:"BookOpenText"},{id:"binding",title:"صحافی",enTitle:"Binding",category:"printing",desc:"ارائه انواع روش‌های صحافی متناسب با نوع سند: سیمی کردن با فنر دوبل فلزی (مقاوم، مناسب دفاتر و کاتالوگ که باید صاف باز شوند)، فنر مارپیچ پلاستیکی (رنگی و اقتصادی، مناسب جزوات درسی)، صحافی چسب‌گرم کتابی یا شومیز (برای کتاب و رمان با ظاهر حرفه‌ای)، منگنه ته (مفتول) وسط برای دفترچه‌های کم‌برگ، و گالینگور جلد سخت برای آرشیو اسناد مهم، مجلات یا نقشه‌های مهندسی که نیاز به دوام بلندمدت دارند. انتخاب نوع صحافی بر اساس تعداد صفحات و کاربرد نهایی سند به مشتری پیشنهاد می‌شود.",icon:"Layers"},{id:"lamination",title:"لمینت",enTitle:"Lamination",category:"printing",desc:"لمینت (پرس حرارتی) با دو روش گرم و سرد بر روی مدارک هویتی (کارت ملی، کارت دانشجویی)، عکس‌ها، منوی رستوران و نقشه‌ها. لمینت گرم برای اسناد ضخیم و بادوام‌تر و لمینت سرد برای مدارک حساس به حرارت (مانند برخی کارت‌های مغناطیسی) استفاده می‌شود. این پوشش شفاف پلاستیکی، سند شما را در برابر آب‌خوردگی، گرد و غبار، خط و خش و رنگ‌پریدگی ناشی از نور محافظت کرده و ماندگاری آن را چند برابر می‌کند. قابل اجرا از سایز کوچک کارت ملی تا عرض‌های بزرگ تبلیغاتی و پوستر.",badge:"ضدآب",icon:"SquareDot"},{id:"design-service",title:"طراحی",enTitle:"Design Service",category:"printing",desc:"خدمات طراحی گرافیک اختصاصی توسط طراحان مجرب با نرم‌افزارهای حرفه‌ای فتوشاپ و ایلاستریتور، شامل: طراحی لوگو و هویت بصری، طراحی کارت ویزیت و سربرگ هماهنگ با برند، طراحی تراکت و بنرهای تبلیغاتی و مناسبتی (تسلیت، خیرمقدم)، روتوش و بازسازی عکس‌های قدیمی و آسیب‌دیده، و صفحه‌آرایی کامل کتاب یا پایان‌نامه. مشتری می‌تواند ایده اولیه خود را شرح دهد و طراح پس از دریافت بازخورد، طرح نهایی آماده چاپ را تحویل می‌دهد. زمان طراحی بسته به پیچیدگی کار از چند ساعت تا ۲ روز متغیر است.",badge:"توسط طراح مجرب",icon:"Palette"},{id:"other-print",title:"سایر خدمات چاپ",enTitle:"Other Print Services",category:"printing",desc:"در کنار خدمات ذکرشده، امکان اجرای سفارش‌های چاپی خاص و غیرمتعارف نیز فراهم است؛ مانند چاپ روی لیوان سرامیکی، چاپ روی تی‌شرت با تکنیک حرارتی، تولید پیکسل و آویز تبلیغاتی، چاپ فرم‌های اختصاصی اداری (مانند فاکتور شماره‌دار)، و چاپ روی جاکلیدی یا ماگ به‌عنوان هدیه تبلیغاتی. برای این دسته از سفارش‌ها، حتماً از طریق تماس تلفنی یا پیام‌رسان جزئیات دقیق درخواست خود (جنس، تعداد، طرح) را با ما در میان بگذارید تا امکان‌سنجی و قیمت‌گذاری دقیق انجام شود.",icon:"MoreHorizontal"},{id:"print",title:"پرینت",enTitle:"Print",category:"copy-center",desc:"پرینت فوری فایل‌های شخصی شما (پی‌دی‌اف، ورد، پاورپوینت، تصاویر) مستقیماً از روی فلش‌مموری، کارت حافظه، گوشی موبایل (اندروید و آیفون)، ایمیل یا لینک ارسالی در پیام‌رسان‌ها. تنظیمات قابل انجام شامل انتخاب اندازه کاغذ (A4، A5)، پرینت چند صفحه در یک برگ (Multiple pages per sheet) برای صرفه‌جویی، تنظیم حاشیه‌ها و چاپ رنگی یا سیاه‌وسفید است. برخلاف خدمات چاپخانه‌ای که برای تیراژ بالا مناسب است، این سرویس برای پرینت تک یا چند نسخه‌ای فوری طراحی شده و در کمتر از ۵ دقیقه آماده تحویل است.",badge:"سریع‌ترین زمان",icon:"Printer"},{id:"scan",title:"اسکن",enTitle:"Scan",category:"copy-center",desc:"اسکن با دقت بالا (تا ۶۰۰ dpi) برای مدارک تحصیلی، کارت‌های شناسایی، عکس‌های قدیمی و اسناد ملکی. خروجی قابل ارائه در سه فرمت اصلی است: PDF (مناسب برای اسناد چندصفحه‌ای و بارگذاری در سامانه‌های دولتی و دانشگاهی)، JPG (مناسب برای عکس و تصاویر با حجم کم جهت ارسال سریع) و TIFF (کیفیت آرشیوی بدون افت فشرده‌سازی، مناسب اسناد مهم و آرشیو حرفه‌ای). امکان اسکن اسناد حجیم مانند کتاب‌های قطور و پرونده‌های چندصفحه‌ای به‌صورت یکجا و تبدیل به یک فایل PDF منظم و شماره‌گذاری‌شده نیز فراهم است.",icon:"Scan"},{id:"typing",title:"تایپ",enTitle:"Typing",category:"copy-center",desc:"تایپ دقیق متون دست‌نویس، فایل‌های صوتی (پیاده‌سازی مصاحبه و کلاس) و اسناد اسکن‌شده در زبان‌های فارسی، عربی و انگلیسی، همراه با رعایت اصول ویراستاری، نیم‌فاصله و جای‌گذاری صحیح علائم نگارشی. این خدمت شامل رسم جداول پیچیده، فرمول‌نویسی تخصصی ریاضی و شیمی (با Equation Editor) و رسم نمودارهای آماری نیز می‌شود. پس از تحویل نسخه اولیه، امکان یک بار ویرایش رایگان بر اساس بازخورد مشتری وجود دارد. زمان تحویل بسته به حجم متن از ۳۰ دقیقه (نیم صفحه) تا چند ساعت (چند صفحه) متغیر است.",badge:"تایپ سریع",icon:"Keyboard"},{id:"translation",title:"ترجمه",enTitle:"Translation",category:"copy-center",desc:"ترجمه روان و تخصصی متون از انگلیسی به فارسی و بالعکس توسط مترجمین دانشگاهی مجرب، شامل: مقالات علمی و پژوهشی (با حفظ اصطلاحات تخصصی رشته)، متون تجاری و بازرگانی، کاتالوگ و بروشور محصولات خارجی، و چکیده پایان‌نامه (Abstract). پس از ترجمه اولیه، متن توسط ویراستار دوم بازبینی و اصلاح می‌شود تا از دقت و روانی جمله‌بندی اطمینان حاصل گردد. برای متون کوتاه (زیر ۱ صفحه) تحویل در همان روز و برای متون طولانی‌تر هماهنگی زمانی جداگانه انجام می‌شود.",icon:"Languages"},{id:"online-reg",title:"ثبت‌نام اینترنتی",enTitle:"Online Registration",category:"copy-center",desc:"انجام دقیق و بدون خطای ثبت‌نام‌های اینترنتی حساس شامل: ثبت‌نام مدارس و پیش‌دبستانی، ثبت‌نام کنکور سراسری، کارشناسی ارشد و دکتری، آزمون‌های استخدامی دستگاه‌های دولتی، سامانه سجام برای فعالیت در بورس، پیش‌ثبت‌نام کتب درسی وزارت آموزش و پرورش، آزمون‌های نظام مهندسی ساختمان، و ثبت‌نام طرح‌های مسکن ملی. با توجه به حساسیت و برگشت‌ناپذیر بودن برخی ثبت‌نام‌ها، مدارک لازم (کد ملی، شماره شناسنامه، عکس پرسنلی) پیش از شروع از متقاضی دریافت و صحت آن‌ها بررسی می‌شود.",badge:"بدون خطا",icon:"UserCheck"},{id:"govt-services",title:"خدمات دولتی",enTitle:"Government Services",category:"copy-center",desc:"دسترسی و انجام امور در درگاه‌های رسمی الکترونیکی دولت، شامل: ثبت‌نام و پیگیری در سامانه ثنا (ابلاغ الکترونیک قوه قضاییه)، کارپوشه ملی من (سخا) برای وضعیت نظام وظیفه و خودرو، استعلام سوابق بیمه از سامانه تامین اجتماعی، خدمات سامانه مودیان مالیاتی برای اصناف، دریافت فیش حقوقی بازنشستگان کشوری و لشکری، و ثبت و پیگیری شکایات در سامانه‌های اداری. تمامی این خدمات با رعایت کامل محرمانگی اطلاعات هویتی مراجعه‌کننده انجام می‌شود.",badge:"رسمی و معتبر",icon:"ShieldAlert"},{id:"uni-services",title:"خدمات دانشگاهی",enTitle:"University Services",category:"copy-center",desc:"پشتیبانی کامل از امور دانشجویی در سامانه‌های دانشگاهی رایج مانند گلستان، هم‌آوا و سیدا؛ شامل انتخاب واحد ترمی، پرداخت آنلاین شهریه، ثبت درخواست وام دانشجویی صندوق رفاه، بارگذاری فایل نهایی پایان‌نامه در سامانه ایرانداک، رزرو ژتون غذای سلف سرویس، دریافت و چاپ کارت ورود به جلسه امتحانات پایان‌ترم، و ثبت‌نام در همایش‌ها و کارگاه‌های دانشگاهی. مناسب برای دانشجویانی که به دلیل کمبود وقت یا مشکل فنی سیستم، امکان انجام این امور را از خانه ندارند.",icon:"GraduationCap"},{id:"bill-payment",title:"پرداخت قبوض",enTitle:"Bill Payment",category:"copy-center",desc:"استعلام سریع و پرداخت آنلاین قبوض خدماتی منزل و محل کار شامل آب، برق، گاز و تلفن ثابت، همچنین شارژ و بسته اینترنت موبایل. علاوه بر این، استعلام و پرداخت خلافی خودرو و موتورسیکلت از سامانه راهور، پرداخت عوارض آزادراهی و عوارض سالانه خودرو، و پرداخت عوارض شهرداری نیز انجام می‌شود. پس از هر تراکنش موفق، یک رسید چاپی معتبر با کد رهگیری به مشتری تحویل داده می‌شود تا از انجام صحیح پرداخت اطمینان حاصل کند.",icon:"DollarSign"},{id:"reservations",title:"رزروها",enTitle:"Reservations",category:"copy-center",desc:"خرید و صدور آنی بلیط در مسیرهای مختلف شامل: بلیط هواپیمای داخلی و خارجی از تمامی ایرلاین‌ها، بلیط قطارهای رجا و فدک برای سفرهای بین‌شهری، و بلیط اتوبوس‌های VIP و معمولی. همچنین رزرو اتاق در هتل‌ها و اقامتگاه‌های بوم‌گردی سراسر کشور، و اخذ نوبت آنلاین برای مراکز پزشکی، دندان‌پزشکی، مراکز معاینه فنی خودرو و سفارت‌خانه‌ها (در صورت وجود سامانه نوبت‌دهی آنلاین) انجام می‌گیرد. بلیط صادرشده بلافاصله چاپ یا به شماره تماس مشتری ارسال می‌شود.",badge:"صدور آنی بلیط",icon:"CalendarRange"},{id:"other-copy",title:"سایر خدمات کافی‌نت",enTitle:"Other Copy Center Services",category:"copy-center",desc:"انجام سایر امور متفرقه اینترنتی که در دسته‌بندی‌های بالا نگنجیده‌اند؛ از جمله ساخت آدرس ایمیل جدید، دانلود و نصب راهنمای نرم‌افزارهای کاربردی، جستجو و گردآوری منابع برای تحقیق و مقالات دانشجویی، استخراج و چاپ فیش‌های حقوقی کارمندان، تکمیل اظهارنامه مالیاتی مشاغل خودرو (پلاک‌های عمومی)، و هرگونه فعالیت مجاز دیگر تحت وب که نیازمند دسترسی به اینترنت و رایانه است. در صورت عدم اطمینان از امکان انجام یک درخواست خاص، پیش از مراجعه با ما تماس بگیرید.",icon:"Globe"}],Es=[{id:"news-1",title:"تخفیف ویژه دانشجویی برای چاپ پایان‌نامه و جزوات",category:"discounts",categoryLabel:"تخفیف‌ها",date:"۱۰ اسفند ۱۴۰۴",summary:"به مناسبت فرارسیدن فصل دفاع پایان‌نامه‌ها و امتحانات دانشگاهی، کلیه خدمات تکثیر جزوات درسی و صحافی گالینگور با ۱۵٪ تخفیف ارائه می‌گردد.",content:"دانشجویان گرامی سراسر کشور می‌توانند فایل‌های پایان‌نامه و جزوات آموزشی خود را از طریق پیام‌رسان‌ها برای ما ارسال کنند. خدمات پرینت سیاه و سفید و رنگی با کاغذ درجه‌یک، صحافی جلد سخت (گالینگور) طلاکوب با استانداردهای رسمی تمامی دانشگاه‌ها، و منگنه یا سیمی کردن جزوات به صورت فوری و با تخفیف ۱۵ درصدی انجام می‌گیرد. نیازی به مراجعه حضوری در صف‌های طولانی کافی‌نت نیست؛ فایل را بفرستید، پس از آماده‌سازی هماهنگ می‌کنیم تا تحویل بگیرید یا برایتان ارسال کنیم."},{id:"news-2",title:"راه‌اندازی دستگاه چاپ بنر عریض با کیفیت عالی",category:"latest-services",categoryLabel:"جدیدترین خدمات",date:"۵ اسفند ۱۴۰۴",summary:"با افزوده شدن دستگاه فوق‌پیشرفته چاپ بنر فضای باز به چاپ دیجیتال احناف، آماده خدمت‌رسانی سریع‌تر و باکیفیت‌تر در زمینه چاپ انواع بنر هستیم.",content:"در راستای توسعه خدمات و پاسخگویی به تقاضای همشهریان محترم، دستگاه چاپ بنر عریض با دقت چاپ بالا و ماندگاری فوق‌العاده رنگ‌ها به مجموعه اضافه شد. از این پس چاپ انواع بنرهای تسلیت، خوش‌آمدگویی خیرمقدم، بنرهای مناسبتی اداری و مذهبی، بنر افتتاحیه کسب‌وکارها و بنرهای تبلیغاتی بزرگ در عرض کمتر از ۲ ساعت با بالاترین تراکم رنگ و متریال ضخیم انجام می‌گیرد. امکان پانچ لبه‌ها و دوردوزی جهت نصب راحت نیز فراهم است."},{id:"news-3",title:"ساعات کاری فروشگاه در ایام تعطیلات نوروز ۱۴۰۵",category:"announcements",categoryLabel:"اطلاعیه‌ها",date:"۱ اسفند ۱۴۰۴",summary:"ضمن عرض تبریک پیشاپیش سال نو، بدینوسیله ساعات کاری مجموعه چاپ دیجیتال احناف در ایام تعطیلات رسمی نوروز اعلام می‌گردد.",content:"مشتریان گرامی و همراهان همیشگی، ضمن آرزوی سالی سرشار از برکت و موفقیت، به اطلاع می‌رساند فروشگاه فیزیکی از تاریخ ۲۹ اسفند ۱۴۰۴ لغایت ۵ فروردین ۱۴۰۵ تعطیل خواهد بود. با این حال، پشتیبانی آنلاین در کلیه پیام‌رسان‌ها (ایتا، روبیکا، بله، سروش، تلگرام، واتس‌اپ) برقرار بوده و سفارش‌های اضطراری طراحی یا آماده‌سازی پروژه‌های اینترنتی پذیرا خواهیم بود. از ۶ فروردین ۱۴۰۵، مجدداً در ساعات کاری معمول (۸ صبح الی ۹ شب) به صورت حضوری آماده پذیرایی از شما هستیم."},{id:"news-4",title:"پشتیبانی کامل از ۷ پیام‌رسان محبوب ایرانی و خارجی",category:"news",categoryLabel:"اخبار",date:"۲۰ بهمن ۱۴۰۴",summary:"جهت سهولت در ثبت سفارش غیرحضوری و ارسال فایل، کانال‌ها و شناسه‌های رسمی ما در ۷ پیام‌رسان فعال شد.",content:'یکی از دغدغه‌های اصلی مشتریان، نحوه ارسال فایل‌های پرحجم بدون افت کیفیت بود. خوشبختانه با راه‌اندازی سامانه‌های یکپارچه بر بستر پیام‌رسان‌های تلگرام، واتس‌اپ، ایتا، روبیکا، بله، سروش و اینستاگرام، شما می‌توانید به راحتی فایل پی‌دی‌اف، عکس یا سند متنی خود را ارسال کنید. کارشناسان ما به محض دریافت فایل، قیمت را محاسبه کرده و پس از تایید شما، کار چاپ را آغاز می‌کنند. شماره تلفن‌های فروشگاه و شناسه‌های کاربری در بخش "تماس با ما" قابل دسترسی است.'}],kx=({className:E="w-6 h-6",size:C})=>{const T=C?{width:C,height:C}:{};return c.jsx("svg",{className:E,style:T,viewBox:"0 0 24 24",fill:"currentColor",children:c.jsx("path",{d:"M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.02-1.96 1.25-5.54 3.66-.52.36-1 .53-1.42.52-.47-.01-1.37-.27-2.03-.49-.82-.27-1.47-.42-1.42-.88.03-.24.35-.49.96-.74 3.78-1.64 6.3-2.73 7.55-3.25 3.59-1.49 4.34-1.75 4.82-1.76.11 0 .35.03.5.16.13.1.17.24.18.34-.01.07 0 .21-.02.32z
